[project]
name = "biaspay"
version = "2.0.0"
description = "Python client for the Bias API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bias" }]
keywords = ["bias", "biaspay", "payments", "api", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["httpx>=0.27", "pydantic>=2.7", "typing-extensions>=4.10"]

[project.urls]
Homepage = "https://biaspay.com"
Documentation = "https://docs.biaspay.com"
Repository = "https://github.com/BiasPay/python-sdk"
Issues = "https://github.com/BiasPay/python-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biaspay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
