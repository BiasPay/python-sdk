name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.2
            - run: uv sync --all-extras --frozen
            - run: uv run ruff check .
            - run: uv run pytest
            - run: uv build
